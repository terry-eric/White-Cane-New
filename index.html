<!DOCTYPE html>
<html lang="zh" data-bs-theme="dark">

<head>
    <title>White Cane Connect APP</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no,maximum-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

    <link rel="stylesheet" href="./sytle.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon/fox-icon.png">
    <style>
        .btn-lg {
            height: 20vh;
            font-weight: bold;
            font-size: 6vh;
            line-height: 1.2em;
            /* 減少行高 */
        }

        .btn-lg-2 {
            height: 30vh;
            font-weight: bold;
            font-size: 4vh;
        }

        .front-6 {
            font-size: 6vh;
            text-align: center;
            font-weight: bold;
        }

        .dist-box {
            width: 100%;
            height: 18vh;
            margin-top: 20px;
            border: 6px solid #0dcaf0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10vh;
            font-weight: bold;
            color: #0dcaf0;
            background-color: #000;
        }

        .btn-auto-text {
            font-size: clamp(4vh, 6vw, 8vh);
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div id="lock-screen" class="hidden">
        <div class="container flex-mid">
            <div class="col-12">
                <div class="d-grid gap-2">
                    <div class="progress" style="height: 100px;">
                        <div id="unlock-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning"
                            role="progressbar" style="width: 0%; transition: none; font-size: 40px;">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid mt-3">
        <!-- <div class="front-6">導盲杖APP😊</div> -->
        <div class="front-6">智能手杖APP😊</div>
        <div class="d-grid gap-2">
            <button id="myButton" class="btn btn-primary outline btn-lg mb-3">點擊開始</button>
        </div>
        <div class="d-flex gap-2 mb-3">
            <button id="bleButton" class="btn btn-info outline btn-lg btn-auto-text flex-fill">
                <div>切換</div>
                <div id="voice-toggle">語音</div>
            </button>
            <button id="btn-lock" class="btn btn-warning outline btn-lg btn-auto-text flex-fill">
                <div>螢幕</div>
                <div>保護</div>
            </button>
            <button id="btn-calibrate" class="btn btn-success outline btn-lg btn-auto-text flex-fill"
                data-bs-toggle="modal" data-bs-target="#calibrateModal">
                <div>自動</div>
                <div>校正</div>
            </button>
        </div>

        <!-- 自動校正 Modal -->
        <div class="modal fade" id="calibrateModal" tabindex="-1" aria-labelledby="calibrateModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success">
                        <h5 class="modal-title" id="calibrateModalLabel">🎯 自動校正</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center" style="font-size: 1.5rem;">
                        <p>📢 <strong>請保持正常握姿</strong></p>
                        <p>確保手杖處於正常使用狀態後，按下「開始校正」按鈕</p>
                        <div id="calibrate-result" class="mt-3" style="display: none;">
                            <div class="alert alert-info">
                                <strong>校正結果：</strong><br>
                                高低差閥值：<span id="calibrate-height-val">--</span> cm
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-success btn-lg" id="btn-start-calibrate">開始校正</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="front-6">警示聲測試🎶</div>
        <div class="btn-group-vertical mt-3 btn-lg-2 col-12" role="group" aria-label="Basic outlined example">
            <button id="btn-height" type="button" class="btn btn-success front-6">注意高低差</button>
            <!-- <button id="btn-GuideBrick" type="button" class="btn btn-info front-6">發現斑馬線</button> -->
            <button id="btn-GuideBrick" type="button" class="btn btn-info front-6">發現導盲磚</button>
            <button id="btn-obstacle" type="button" class="btn btn-danger front-6">注意障礙物</button>
        </div>
        <div class="input-group mb-3 mt-3">
            <span class="input-group-text">障礙物閥值</span>
            <input type="number" id="obstacle-threshold" class="form-control" placeholder="cm" value="50">
            <button class="btn btn-primary" type="button" id="btn-set-obstacle">設定</button>
        </div>
        <input type="range" class="form-range mb-3" id="obstacle-slider" min="10" max="250" value="50">
        <div class="input-group mb-3">
            <span class="input-group-text">高低差閥值</span>
            <input type="number" id="height-threshold" class="form-control" placeholder="cm" value="10">
            <button class="btn btn-primary" type="button" id="btn-set-height">設定</button>
        </div>
        <input type="range" class="form-range mb-3" id="height-slider" min="5" max="250" value="10">
        <div id="dist-box" class="dist-box"></div>
    </div>
    <script>
        // a2hs https://github.com/mdn/pwa-examples/tree/main/a2hs
        // Register service worker to control making site work offline 
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('/white-cane-app/sw.js')
                .then(() => { console.log('Service Worker Registered'); });
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="animation_erase.js?v=2"></script>
    <script type="module" src="bluetooth.js?v=2"></script>
    <script type="module" src="index.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>
    <audio id="a_mp3" src="a.mp3"></audio>
    <audio id="b_mp3" src="b.mp3"></audio>
    <audio id="c_mp3" src="c.mp3"></audio>
    <audio id="d_mp3" src="d.mp3"></audio>
    <audio id="e_mp3" src="e.mp3"></audio>
    <audio id="f_mp3" src="f.mp3"></audio>
    <audio id="g_mp3" src="g.mp3"></audio>
</body>

</html>
